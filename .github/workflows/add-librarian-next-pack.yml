# trigger 2026-09-22
name: Add Librarian Next Pack

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-librarian-next-pack.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Librarian features
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/index.html')
          c=p.read_text(encoding='utf-8')
          def rep(a,b,label):
              global c
              if a not in c:
                  raise SystemExit('Missing '+label)
              c=c.replace(a,b,1)

          rep("""'Librarian:reservation-expiry':'librarian-reservation-expiry-2026-09-22-v1',
'Librarian:fine-history':'librarian-fine-history-2026-09-22-v1',
'Librarian:service-queue':'librarian-service-queue-2026-09-22-v1',
'Librarian:inventory-closing':'librarian-inventory-closing-2026-09-22-v1'""",
          """'Librarian:special-borrowing':'librarian-special-borrowing-2026-09-22-v1',
'Librarian:lost-found':'librarian-lost-found-2026-09-22-v1',
'Librarian:maintenance-requests':'librarian-maintenance-requests-2026-09-22-v1',
'Librarian:kpi-dashboard':'librarian-kpi-dashboard-2026-09-22-v1'""",
          'latest librarian release batch')

          rep("""if(role==='Librarian'&&label==='Reservation Expiry Management')return 'Librarian:reservation-expiry';
if(role==='Librarian'&&label==='Fine Adjustment / Waiver History')return 'Librarian:fine-history';
if(role==='Librarian'&&label==='Library Service Counter Queue')return 'Librarian:service-queue';
if(role==='Librarian'&&label==='Annual Inventory Closing')return 'Librarian:inventory-closing';
return null;""",
          """if(role==='Librarian'&&label==='Special Borrowing Exceptions')return 'Librarian:special-borrowing';
if(role==='Librarian'&&label==='Lost & Found Management')return 'Librarian:lost-found';
if(role==='Librarian'&&label==='Library Maintenance Requests')return 'Librarian:maintenance-requests';
if(role==='Librarian'&&label==='Library KPI Dashboard')return 'Librarian:kpi-dashboard';
return null;""",
          'latest librarian feature ids')

          rep("""if(activeRole==='Librarian'&&b.classList.contains('node')){
  if(label==='Circulation'&&(featureUnseen('Librarian:reservation-expiry')||featureUnseen('Librarian:service-queue')))unseen=true;
  if(label==='Overdue & Clearance'&&featureUnseen('Librarian:fine-history'))unseen=true;
  if(label==='Inventory'&&featureUnseen('Librarian:inventory-closing'))unseen=true;
}""",
          """if(activeRole==='Librarian'&&b.classList.contains('node')){
  if(label==='Circulation'&&featureUnseen('Librarian:special-borrowing'))unseen=true;
  if(label==='Programs & Engagement'&&featureUnseen('Librarian:lost-found'))unseen=true;
  if(label==='Inventory'&&featureUnseen('Librarian:maintenance-requests'))unseen=true;
  if(label==='Reports'&&featureUnseen('Librarian:kpi-dashboard'))unseen=true;
}""",
          'librarian parent highlights')

          rep("""'Circulation':['Borrow / Return','Reservations / Hold Queue','Reservation Expiry Management','Borrower History','Library Card / QR Verification','Borrowing Rules','Lost Library Card / Replacement','Inter-Library Loan','Library Service Counter Queue'],""",
          """'Circulation':['Borrow / Return','Reservations / Hold Queue','Reservation Expiry Management','Borrower History','Library Card / QR Verification','Borrowing Rules','Special Borrowing Exceptions','Lost Library Card / Replacement','Inter-Library Loan','Library Service Counter Queue'],""",
          'circulation submenu')
          rep("""'Inventory':['Inventory & Shelf Audit','Stock Reconciliation','Book Condition Tracking','Missing Book Review','Library Equipment Tracking','Shelf Transfer / Relocation Log','Annual Inventory Closing'],""",
          """'Inventory':['Inventory & Shelf Audit','Stock Reconciliation','Book Condition Tracking','Missing Book Review','Library Equipment Tracking','Shelf Transfer / Relocation Log','Library Maintenance Requests','Annual Inventory Closing'],""",
          'inventory submenu')
          rep("""'Programs & Engagement':['Reading Program Tracker','Popular Books / Most Borrowed','Library Visit Log','Library Announcements','Reading Room / Seat Management','Library Calendar','Library Feedback & Suggestions'],""",
          """'Programs & Engagement':['Reading Program Tracker','Popular Books / Most Borrowed','Library Visit Log','Library Announcements','Reading Room / Seat Management','Library Calendar','Library Feedback & Suggestions','Lost & Found Management'],""",
          'programs submenu')
          rep("""'Reports':['Reports & Export Center','Circulation Report','Overdue Report','Inventory Report','Visitor Report','Reading Program Report','Year-End Statistics Dashboard','Library Audit Trail','Library Incident & Behavior Log','Full Library Backup & Restore']""",
          """'Reports':['Reports & Export Center','Circulation Report','Overdue Report','Inventory Report','Visitor Report','Reading Program Report','Year-End Statistics Dashboard','Library KPI Dashboard','Library Audit Trail','Library Incident & Behavior Log','Full Library Backup & Restore']""",
          'reports submenu')

          anchor="const librarianModuleBase=openModule;"
          if anchor not in c:
              raise SystemExit('Missing Librarian module anchor')
          block=r'''
/* Librarian special borrowing, lost and found, maintenance, and KPI pack */
if(!Array.isArray(libraryState.borrowingExceptions))libraryState.borrowingExceptions=[
  {id:'EXC-001',borrower:'Ms. Rivera',borrowerId:'TCH-001',type:'Teacher',maxBooks:6,loanDays:21,reason:'Science research materials',validUntil:'2026-10-31',status:'Approved'}
];
if(!Array.isArray(libraryState.lostFound))libraryState.lostFound=[
  {id:'LF-001',item:'Blue water bottle',location:'Reading Area',dateFound:'2026-09-21',finder:'Library Staff',status:'Unclaimed',claimant:''}
];
if(!Array.isArray(libraryState.maintenanceRequests))libraryState.maintenanceRequests=[
  {id:'MNT-001',area:'Reading Area',item:'Ceiling light',issue:'Light is flickering',priority:'Normal',status:'Open',date:'2026-09-22'}
];
librarySave();

const libraryViewFinalOpsBase=libraryView;
libraryView=function(view){
  const special=['Special Borrowing Exceptions','Lost & Found Management','Library Maintenance Requests','Library KPI Dashboard'];
  if(!special.includes(view))return libraryViewFinalOpsBase(view);
  featureOpened(view);
  currentModule=view;
  if(typeof libraryAudit==='function')libraryAudit('Opened '+view,view);
  const r=demoPanel(view,'Librarian workspace · Demo');
  $('module-back').hidden=true;

  if(view==='Special Borrowing Exceptions'){
    r.append(card('SPECIAL BORROWING EXCEPTIONS',[
      libraryState.borrowingExceptions.filter(x=>x.status==='Approved').length+' active exception(s)',
      'Approve temporary higher borrowing limits or longer loan periods for special cases.'
    ]));
    r.append(form([
      {key:'borrower',label:'Borrower name'},
      {key:'borrowerId',label:'Borrower ID'},
      {key:'type',label:'Borrower type',options:['Teacher','Researcher','Student','Staff','Other']},
      {key:'maxBooks',label:'Maximum books allowed',type:'number'},
      {key:'loanDays',label:'Loan period (days)',type:'number'},
      {key:'validUntil',label:'Valid until',type:'date'},
      {key:'reason',label:'Reason / approval basis',type:'textarea'}
    ],'APPROVE EXCEPTION',v=>{
      libraryState.borrowingExceptions.unshift({
        id:'EXC-'+Date.now().toString().slice(-6),borrower:v.borrower,borrowerId:v.borrowerId,type:v.type,
        maxBooks:Math.max(1,Number(v.maxBooks)||1),loanDays:Math.max(1,Number(v.loanDays)||7),
        validUntil:v.validUntil,reason:v.reason||'Approved exception',status:'Approved'
      });
      if(typeof libraryAudit==='function')libraryAudit('Approved borrowing exception for '+v.borrower,'Special Borrowing Exceptions');
      librarySave('Special borrowing exception approved.');libraryView(view);
    }));
    libraryState.borrowingExceptions.forEach(x=>{
      const expired=x.validUntil&&x.validUntil<staffDate();
      const box=card(x.borrower+' · '+x.borrowerId,[
        'Type · '+x.type,
        'Limit · '+x.maxBooks+' book(s)',
        'Loan period · '+x.loanDays+' day(s)',
        'Valid until · '+x.validUntil,
        'Reason · '+x.reason,
        'Status · '+(expired&&x.status==='Approved'?'Expired':x.status)
      ]);
      if(x.status==='Approved'&&!expired)box.append(action('REVOKE EXCEPTION',()=>{
        x.status='Revoked';if(typeof libraryAudit==='function')libraryAudit('Revoked borrowing exception '+x.id,'Special Borrowing Exceptions');
        librarySave('Exception revoked.');libraryView(view);
      },'outline'));
      r.append(box);
    });
  }

  if(view==='Lost & Found Management'){
    r.append(card('LOST & FOUND MANAGEMENT',[
      libraryState.lostFound.filter(x=>x.status==='Unclaimed').length+' unclaimed item(s)',
      'Record items found in the library and track claims and releases.'
    ]));
    r.append(form([
      {key:'item',label:'Item description'},
      {key:'location',label:'Where found'},
      {key:'dateFound',label:'Date found',type:'date'},
      {key:'finder',label:'Found by'}
    ],'RECORD FOUND ITEM',v=>{
      libraryState.lostFound.unshift({id:'LF-'+Date.now().toString().slice(-6),...v,status:'Unclaimed',claimant:''});
      if(typeof libraryAudit==='function')libraryAudit('Recorded found item: '+v.item,'Lost & Found Management');
      librarySave('Found item recorded.');libraryView(view);
    }));
    libraryState.lostFound.forEach(x=>{
      const box=card(x.id+' · '+x.item,[
        'Found at · '+x.location,
        'Date found · '+x.dateFound,
        'Found by · '+x.finder,
        'Status · '+x.status,
        x.claimant?'Claimant · '+x.claimant:''
      ].filter(Boolean));
      if(x.status==='Unclaimed')box.append(action('MARK CLAIMED',()=>{
        const claimant=prompt('Claimant name:');if(!claimant)return;
        x.claimant=claimant.trim();x.status='Claimed';x.claimedDate=staffDate();
        if(typeof libraryAudit==='function')libraryAudit('Claimed lost & found item '+x.id,'Lost & Found Management');
        librarySave('Item marked claimed.');libraryView(view);
      },'primary'));
      if(x.status==='Claimed')box.append(action('MARK RELEASED',()=>{
        x.status='Released';x.releasedDate=staffDate();librarySave('Item released to claimant.');libraryView(view);
      },'outline'));
      r.append(box);
    });
  }

  if(view==='Library Maintenance Requests'){
    r.append(card('LIBRARY MAINTENANCE REQUESTS',[
      libraryState.maintenanceRequests.filter(x=>!['Completed','Cancelled'].includes(x.status)).length+' open request(s)',
      'Report shelves, lights, furniture, computers, air-conditioning, and other library maintenance needs.'
    ]));
    r.append(form([
      {key:'area',label:'Library area / location'},
      {key:'item',label:'Item / facility'},
      {key:'issue',label:'Issue / maintenance needed',type:'textarea'},
      {key:'priority',label:'Priority',options:['Low','Normal','High','Urgent']}
    ],'SUBMIT MAINTENANCE REQUEST',v=>{
      libraryState.maintenanceRequests.unshift({id:'MNT-'+Date.now().toString().slice(-6),...v,status:'Open',date:staffDate()});
      if(typeof libraryAudit==='function')libraryAudit('Submitted maintenance request for '+v.item,'Library Maintenance Requests');
      librarySave('Maintenance request submitted.');libraryView(view);
    }));
    libraryState.maintenanceRequests.forEach(x=>{
      const box=card(x.id+' · '+x.item,[
        'Area · '+x.area,
        'Issue · '+x.issue,
        'Priority · '+x.priority,
        'Status · '+x.status,
        'Date · '+x.date
      ]);
      if(x.status==='Open')box.append(action('MARK IN PROGRESS',()=>{x.status='In Progress';librarySave('Maintenance request started.');libraryView(view)},'outline'));
      else if(x.status==='In Progress')box.append(action('MARK COMPLETED',()=>{
        x.status='Completed';x.completed=staffDate();
        if(typeof libraryAudit==='function')libraryAudit('Completed maintenance request '+x.id,'Library Maintenance Requests');
        librarySave('Maintenance request completed.');libraryView(view);
      },'primary'));
      r.append(box);
    });
  }

  if(view==='Library KPI Dashboard'){
    const books=libraryState.books||[],loans=libraryState.loans||[],visits=libraryState.visits||[];
    const activeLoans=loans.filter(x=>!x.returned).length;
    const overdue=libraryOverdues().length;
    const circulationRate=books.length?Math.round((loans.length/books.length)*100):0;
    const overdueRate=activeLoans?Math.round((overdue/activeLoans)*100):0;
    const available=books.reduce((n,b)=>n+Number(b.available||0),0);
    const copies=books.reduce((n,b)=>n+Number(b.copies||0),0);
    const utilization=copies?Math.round(((copies-available)/copies)*100):0;
    const queue=libraryState.serviceQueue||[];
    const completedQueue=queue.filter(x=>x.status==='Completed').length;
    const acquisitions=libraryState.acquisitions||[];
    const budget=libraryState.budget&&libraryState.budget.entries?libraryState.budget.entries:[];
    const spend=budget.filter(x=>x.status==='Paid').reduce((n,x)=>n+Number(x.amount||0),0);
    r.append(card('LIBRARY KPI DASHBOARD',[
      'Circulation rate · '+circulationRate+' transactions per 100 catalog titles',
      'Overdue rate · '+overdueRate+'% of active loans',
      'Collection utilization · '+utilization+'% of copies currently out',
      'Library visits recorded · '+visits.length,
      'Service queue completed · '+completedQueue,
      'Acquisition requests · '+acquisitions.length,
      'Paid acquisition / library spend · ₱'+spend.toFixed(2)
    ]));
    r.append(table(['KPI','Value'],[
      ['Catalog Titles',books.length],
      ['Total Copies',copies],
      ['Available Copies',available],
      ['Loan Transactions',loans.length],
      ['Active Loans',activeLoans],
      ['Overdue Loans',overdue],
      ['Circulation Rate',circulationRate+' / 100 titles'],
      ['Overdue Rate',overdueRate+'%'],
      ['Collection Utilization',utilization+'%'],
      ['Recorded Visits',visits.length],
      ['Completed Queue Services',completedQueue],
      ['Acquisition Requests',acquisitions.length],
      ['Paid Spend','₱'+spend.toFixed(2)]
    ]));
    r.append(action('PRINT / SAVE KPI DASHBOARD',()=>window.print(),'outline'));
  }
  syncFeatureHighlights();
};
'''
          c=c.replace(anchor,block+'\n'+anchor,1)
          p.write_text(c,encoding='utf-8')
          PY
      - name: Commit patched page
        run: |
          git config user.name "School Orbit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add Librarian borrowing lost-found maintenance and KPI tools"
          git push
