name: Add Librarian Next Pack

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-librarian-next-pack.yml'
      - 'scripts/apply_librarian_pack.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Librarian features
        run: python scripts/apply_librarian_pack.py
      - name: Commit patched page
        run: |
          git config user.name "School Orbit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add Librarian borrowing lost-found maintenance and KPI tools"
          git push
