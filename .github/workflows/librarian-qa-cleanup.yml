name: Librarian QA Cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/librarian-qa-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Librarian QA fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/index.html')
          c=p.read_text(encoding='utf-8')
          if '/* LIBRARIAN QA CLEANUP 2026-09-22 */' in c:
              print('QA cleanup already applied')
              raise SystemExit(0)
          def rep(a,b,label):
              global c
              if a not in c:
                  raise SystemExit('Missing '+label)
              c=c.replace(a,b,1)

          # 1. Correct overdue fine before a return is marked returned.
          rep("""box.append(action('PROCESS RETURN',()=>{
        l.returned=staffDate();l.status='Returned';l.fine=libraryFine(l);
        const b=libraryBook(l.bookId);if(b)b.available=Math.min(b.copies,b.available+1);""",
              """box.append(action('PROCESS RETURN',()=>{
        const finalFine=libraryFine(l);
        l.returned=staffDate();l.status='Returned';l.fine=finalFine;
        const b=libraryBook(l.bookId);if(b)b.available=Math.min(b.copies,b.available+1);""",'return fine flow')

          # 2. Prevent both Paid and Committed entries from overspending the available budget.
          rep("if(v.status==='Committed'&&amount>remaining){feedback('Amount exceeds the available demo budget.');return}",
              "if(amount>remaining){feedback('Amount exceeds the available demo budget.');return}",'budget validation')

          # 3. Separate behavior/safety incidents from damaged/lost book cases.
          rep("""if(!Array.isArray(libraryState.incidents))libraryState.incidents=[
  {id:'INC-001',date:'2026-09-21',person:'Demo Student',type:'Rule Violation',details:'Food brought into reading area.',action:'Verbal reminder',status:'Closed'}
];""",
              """if(!Array.isArray(libraryState.libraryIncidents))libraryState.libraryIncidents=[
  {id:'INC-001',date:'2026-09-21',person:'Demo Student',type:'Rule Violation',details:'Food brought into reading area.',action:'Verbal reminder',status:'Closed'}
];
if(!Array.isArray(libraryState.incidents))libraryState.incidents=[];
const migratedBehavior=(libraryState.incidents||[]).filter(x=>!x.bookId&&(x.person||x.type));
if(migratedBehavior.length){
  const known=new Set(libraryState.libraryIncidents.map(x=>x.id));
  migratedBehavior.forEach(x=>{if(!known.has(x.id))libraryState.libraryIncidents.push(x)});
  libraryState.incidents=libraryState.incidents.filter(x=>x.bookId||String(x.id||'').startsWith('LIB-CASE'));
}""",'incident state split')
          rep("libraryState.incidents.filter(x=>x.status!=='Closed').length+' open incident(s)'",
              "libraryState.libraryIncidents.filter(x=>x.status!=='Closed').length+' open incident(s)'",'incident count')
          rep("libraryState.incidents.unshift({id:'INC-'+Date.now().toString().slice(-6),...v,status:'Open'});",
              "libraryState.libraryIncidents.unshift({id:'INC-'+Date.now().toString().slice(-6),...v,status:'Open'});",'incident create')
          rep("libraryState.incidents.forEach(x=>{\n      const box=card(x.id+' · '+x.type,[",
              "libraryState.libraryIncidents.forEach(x=>{\n      const box=card(x.id+' · '+x.type,[",'incident list')
          rep("const today=staffDate(),loans=libraryState.loans||[],holds=libraryState.holds||[],queue=libraryState.serviceQueue||[],inc=libraryState.incidents||[],mnt=libraryState.maintenanceRequests||[];",
              "const today=staffDate(),loans=libraryState.loans||[],holds=libraryState.holds||[],queue=libraryState.serviceQueue||[],inc=[...(libraryState.incidents||[]),...(libraryState.libraryIncidents||[])],mnt=libraryState.maintenanceRequests||[];",'daily ops incidents')

          # 4. Close audit gaps in operational actions.
          rep("x.status='Released';x.releasedDate=staffDate();librarySave('Item released to claimant.');libraryView(view);",
              "x.status='Released';x.releasedDate=staffDate();if(typeof libraryAudit==='function')libraryAudit('Released lost & found item '+x.id,'Lost & Found Management');librarySave('Item released to claimant.');libraryView(view);",'lost found release audit')
          rep("if(x.status==='Open')box.append(action('MARK IN PROGRESS',()=>{x.status='In Progress';librarySave('Maintenance request started.');libraryView(view)},'outline'));",
              "if(x.status==='Open')box.append(action('MARK IN PROGRESS',()=>{x.status='In Progress';if(typeof libraryAudit==='function')libraryAudit('Started maintenance request '+x.id,'Library Maintenance Requests');librarySave('Maintenance request started.');libraryView(view)},'outline'));",'maintenance start audit')
          rep("libraryState.patronRestrictions.unshift({id:'BLK-'+Date.now().toString().slice(-6),...v,status:'Active',date:staffDate()});librarySave('Patron restriction added.');libraryView(view)",
              "libraryState.patronRestrictions.unshift({id:'BLK-'+Date.now().toString().slice(-6),...v,status:'Active',date:staffDate()});if(typeof libraryAudit==='function')libraryAudit('Added patron restriction for '+v.borrowerId,'Patron Blocking / Restrictions');librarySave('Patron restriction added.');libraryView(view)",'restriction add audit')
          rep("x.status='Lifted';x.lifted=staffDate();librarySave('Restriction lifted.');libraryView(view)",
              "x.status='Lifted';x.lifted=staffDate();if(typeof libraryAudit==='function')libraryAudit('Lifted patron restriction '+x.id,'Patron Blocking / Restrictions');librarySave('Restriction lifted.');libraryView(view)",'restriction lift audit')

          # 5. Keep archive/withdrawn records out of active catalog headline count.
          rep("""r.append(card('BOOK CATALOG',[
      libraryState.books.length+' catalog title(s)',
      'Search the demo catalog or add a new book record.'
    ]));""",
              """const activeCatalogBooks=libraryState.books.filter(b=>!['Archived','Withdrawn'].includes(b.status));
    r.append(card('BOOK CATALOG',[
      activeCatalogBooks.length+' active catalog title(s)',
      (libraryState.books.length-activeCatalogBooks.length)+' archived / withdrawn title(s)',
      'Search the demo catalog or add a new book record.'
    ]));""",'catalog active count')

          # 6. Mobile/print QA polish: allow long table content to wrap when printing and improve focus clarity.
          marker='</style>'
          css="""\n/* LIBRARIAN QA CLEANUP 2026-09-22 */\n@media print{th,td{white-space:normal!important;overflow-wrap:anywhere}.table-wrap{overflow:visible!important}}\n@media(max-width:650px){dialog{padding:16px}.table-wrap{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}.parent-card{overflow-wrap:anywhere}}\n"""
          if marker not in c: raise SystemExit('Missing style close')
          c=c.replace(marker,css+marker,1)

          p.write_text(c,encoding='utf-8')
          PY
      - name: Syntax check JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          c=Path('docs/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',c,re.S)
          Path('/tmp/school-orbit.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/school-orbit.js
      - name: Commit QA cleanup
        run: |
          git config user.name "School Orbit QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m "QA cleanup Librarian workflows and data consistency"
          git push
