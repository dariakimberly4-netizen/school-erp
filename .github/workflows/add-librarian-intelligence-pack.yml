name: Add Librarian Intelligence Pack
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-librarian-intelligence-pack.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Librarian intelligence pack
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/index.html')
          c=p.read_text(encoding='utf-8')
          def rep(a,b,label):
              global c
              if a not in c:
                  raise SystemExit('Missing '+label)
              c=c.replace(a,b,1)

          rep("""'Librarian:policy-ack':'librarian-policy-ack-2026-09-22-v1',
'Librarian:training-log':'librarian-training-log-2026-09-22-v1',
'Librarian:collection-age':'librarian-collection-age-2026-09-22-v1',
'Librarian:occupancy':'librarian-occupancy-2026-09-22-v1'""",
              """'Librarian:demand-analytics':'librarian-demand-analytics-2026-09-22-v1',
'Librarian:curriculum-mapping':'librarian-curriculum-mapping-2026-09-22-v1',
'Librarian:usage-heatmap':'librarian-usage-heatmap-2026-09-22-v1',
'Librarian:command-center':'librarian-command-center-2026-09-22-v1'""",'release batch')

          rep("""if(role==='Librarian'&&label==='Policy Acknowledgement')return 'Librarian:policy-ack';
if(role==='Librarian'&&label==='Library Training & Certification Log')return 'Librarian:training-log';
if(role==='Librarian'&&label==='Collection Age Analysis')return 'Librarian:collection-age';
if(role==='Librarian'&&label==='Library Occupancy Monitor')return 'Librarian:occupancy';
return null;""",
              """if(role==='Librarian'&&label==='Book Demand / Waitlist Analytics')return 'Librarian:demand-analytics';
if(role==='Librarian'&&label==='Curriculum Resource Mapping')return 'Librarian:curriculum-mapping';
if(role==='Librarian'&&label==='Library Usage Heatmap')return 'Librarian:usage-heatmap';
if(role==='Librarian'&&label==='Librarian Command Center')return 'Librarian:command-center';
return null;""",'feature ids')

          rep("""if(activeRole==='Librarian'&&b.classList.contains('node')){
  if(label==='Library Dashboard'&&(featureUnseen('Librarian:policy-ack')||featureUnseen('Librarian:training-log')))unseen=true;
  if(label==='Reports'&&featureUnseen('Librarian:collection-age'))unseen=true;
  if(label==='Programs & Engagement'&&featureUnseen('Librarian:occupancy'))unseen=true;
}""",
              """if(activeRole==='Librarian'&&b.classList.contains('node')){
  if(label==='Library Dashboard'&&featureUnseen('Librarian:command-center'))unseen=true;
  if(label==='Catalog & Collection'&&featureUnseen('Librarian:curriculum-mapping'))unseen=true;
  if(label==='Reports'&&(featureUnseen('Librarian:demand-analytics')||featureUnseen('Librarian:usage-heatmap')))unseen=true;
}""",'highlights')

          rep("'Library Dashboard':['Today’s Library Overview','Daily Operations Dashboard','Circulation Summary','Overdue Alerts','Inventory Status','Quick Actions','Library Closing Checklist','Policy Acknowledgement','Library Training & Certification Log','Library Settings','Library Notifications','User Access & Permissions'],",
              "'Library Dashboard':['Today’s Library Overview','Daily Operations Dashboard','Librarian Command Center','Circulation Summary','Overdue Alerts','Inventory Status','Quick Actions','Library Closing Checklist','Policy Acknowledgement','Library Training & Certification Log','Library Settings','Library Notifications','User Access & Permissions'],",'dashboard menu')
          rep("'Catalog & Collection':['Book Catalog','New Arrivals','Shelf Location Finder','Barcode / ISBN Lookup','Digital Resources','Book Donation Management','Bulk Import Books','Archive / Withdrawn Books','Accession Register','Periodicals / Magazine Management','Subscription Renewal Alerts','Duplicate / Data Quality Checker','Collection Weeding Review'],",
              "'Catalog & Collection':['Book Catalog','New Arrivals','Shelf Location Finder','Barcode / ISBN Lookup','Digital Resources','Book Donation Management','Bulk Import Books','Archive / Withdrawn Books','Accession Register','Periodicals / Magazine Management','Subscription Renewal Alerts','Curriculum Resource Mapping','Duplicate / Data Quality Checker','Collection Weeding Review'],",'catalog menu')
          rep("'Reports':['Reports & Export Center','Circulation Report','Overdue Report','Inventory Report','Visitor Report','Reading Program Report','Year-End Statistics Dashboard','Library KPI Dashboard','Collection Age Analysis','Library Audit Trail','Library Incident & Behavior Log','Full Library Backup & Restore']",
              "'Reports':['Reports & Export Center','Circulation Report','Overdue Report','Inventory Report','Visitor Report','Reading Program Report','Year-End Statistics Dashboard','Library KPI Dashboard','Book Demand / Waitlist Analytics','Library Usage Heatmap','Collection Age Analysis','Library Audit Trail','Library Incident & Behavior Log','Full Library Backup & Restore']",'reports menu')

          anchor="const librarianModuleBase=openModule;"
          if anchor not in c: raise SystemExit('Missing module anchor')
          block=r'''
/* Librarian demand analytics, curriculum mapping, usage heatmap, and command center pack */
if(!Array.isArray(libraryState.curriculumMappings))libraryState.curriculumMappings=[
  {id:'MAP-001',bookId:'BK-001',title:'Science Explorer',grade:'Grade 7',subject:'Science',quarter:'Quarter 1',competency:'Scientific investigation and inquiry',status:'Active'},
  {id:'MAP-002',bookId:'BK-003',title:'Philippine History',grade:'Grade 6',subject:'Araling Panlipunan',quarter:'Quarter 2',competency:'Philippine history and nationhood',status:'Active'}
];
librarySave();

const libraryViewIntelligenceBase=libraryView;
libraryView=function(view){
  const special=['Book Demand / Waitlist Analytics','Curriculum Resource Mapping','Library Usage Heatmap','Librarian Command Center'];
  if(!special.includes(view))return libraryViewIntelligenceBase(view);
  featureOpened(view);currentModule=view;
  if(typeof libraryAudit==='function')libraryAudit('Opened '+view,view);
  const r=demoPanel(view,'Librarian workspace · Demo');
  $('module-back').hidden=true;

  if(view==='Book Demand / Waitlist Analytics'){
    const holds=Array.isArray(libraryState.holds)?libraryState.holds:[];
    const loans=Array.isArray(libraryState.loans)?libraryState.loans:[];
    const books=Array.isArray(libraryState.books)?libraryState.books:[];
    const map=new Map();
    const add=(key,title,kind)=>{
      const k=String(key||title||'Unknown').trim();
      if(!k)return;
      if(!map.has(k))map.set(k,{key:k,title:title||k,holds:0,loans:0});
      map.get(k)[kind]++;
    };
    holds.forEach(h=>{
      const b=books.find(x=>x.id===h.bookId);
      add(h.bookId||h.title,(b&&b.title)||h.title||h.bookId,'holds');
    });
    loans.forEach(l=>{
      const b=books.find(x=>x.id===l.bookId);
      add(l.bookId||l.title,(b&&b.title)||l.title||l.bookId,'loans');
    });
    const rows=[...map.values()].map(x=>({...x,demand:x.holds*3+x.loans})).sort((a,b)=>b.demand-a.demand);
    const ready=holds.filter(h=>String(h.status||'').toLowerCase()==='ready').length;
    const waiting=holds.filter(h=>!['ready','expired / released','completed','cancelled'].includes(String(h.status||'').toLowerCase())).length;
    r.append(card('BOOK DEMAND / WAITLIST ANALYTICS',[
      holds.length+' reservation / hold record(s)',
      waiting+' currently waiting · '+ready+' ready for pickup',
      'Demand score weights each hold higher than a completed loan to reveal titles that may need more copies.'
    ]));
    if(rows.length)r.append(table(['Rank','Book / Title','Holds','Loan Records','Demand Score'],rows.slice(0,20).map((x,i)=>[i+1,x.title,x.holds,x.loans,x.demand])));
    else r.append(card('NO DEMAND DATA YET',['Reservations and borrowing activity will appear here as the demo is used.']));
    const pressure=rows.filter(x=>x.holds>=2);
    if(pressure.length)r.append(card('ACQUISITION SIGNAL',[pressure.length+' title(s) have two or more hold requests and may justify additional copies.']));
  }

  if(view==='Curriculum Resource Mapping'){
    r.append(card('CURRICULUM RESOURCE MAPPING',[
      libraryState.curriculumMappings.length+' active mapping record(s)',
      'Connect library resources to grade level, subject, quarter, and curriculum competency.'
    ]));
    r.append(form([
      {key:'bookId',label:'Book ID'},
      {key:'grade',label:'Grade level',options:['Kindergarten','Grade 1','Grade 2','Grade 3','Grade 4','Grade 5','Grade 6','Grade 7','Grade 8','Grade 9','Grade 10','Grade 11','Grade 12']},
      {key:'subject',label:'Subject'},
      {key:'quarter',label:'Quarter',options:['Quarter 1','Quarter 2','Quarter 3','Quarter 4','Whole Year']},
      {key:'competency',label:'Competency / learning objective',type:'textarea'}
    ],'MAP RESOURCE',v=>{
      const b=libraryBook(v.bookId.trim());
      if(!b){feedback('Book ID not found.');return}
      libraryState.curriculumMappings.unshift({id:'MAP-'+Date.now().toString().slice(-6),bookId:b.id,title:b.title,grade:v.grade,subject:v.subject,quarter:v.quarter,competency:v.competency,status:'Active'});
      if(typeof libraryAudit==='function')libraryAudit('Mapped '+b.id+' to '+v.grade+' '+v.subject,'Curriculum Resource Mapping');
      librarySave('Curriculum mapping added.');libraryView(view);
    }));
    libraryState.curriculumMappings.forEach(x=>{
      const box=card(x.title+' · '+x.grade,[
        'Book ID · '+x.bookId,
        'Subject · '+x.subject,
        'Quarter · '+x.quarter,
        'Competency · '+x.competency,
        'Status · '+x.status
      ]);
      if(x.status==='Active')box.append(action('ARCHIVE MAPPING',()=>{x.status='Archived';librarySave('Mapping archived.');libraryView(view)},'outline'));
      else box.append(action('RESTORE MAPPING',()=>{x.status='Active';librarySave('Mapping restored.');libraryView(view)},'outline'));
      r.append(box);
    });
  }

  if(view==='Library Usage Heatmap'){
    const visits=[];
    if(Array.isArray(libraryState.visits))libraryState.visits.forEach(v=>visits.push({date:v.date||'',time:v.time||v.checkIn||''}));
    if(Array.isArray(libraryState.occupancyLog))libraryState.occupancyLog.forEach(v=>visits.push({date:v.date||'',time:v.checkIn||''}));
    const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const dayCount=Object.fromEntries(days.map(d=>[d,0]));
    const hourCount={};
    visits.forEach(v=>{
      if(v.date){const d=new Date(v.date+'T12:00:00+08:00');if(!isNaN(d))dayCount[days[d.getDay()]]=(dayCount[days[d.getDay()]]||0)+1;}
      const m=String(v.time||'').match(/(\d{1,2}):(\d{2})/);if(m){const h=Number(m[1]);const band=(h<10?'Before 10 AM':h<12?'10–11:59 AM':h<14?'12–1:59 PM':h<16?'2–3:59 PM':'4 PM and later');hourCount[band]=(hourCount[band]||0)+1;}
    });
    const topDay=Object.entries(dayCount).sort((a,b)=>b[1]-a[1])[0];
    const topHour=Object.entries(hourCount).sort((a,b)=>b[1]-a[1])[0];
    r.append(card('LIBRARY USAGE HEATMAP',[
      visits.length+' visit / occupancy entry(ies) analyzed',
      topDay&&topDay[1]?'Busiest day · '+topDay[0]+' ('+topDay[1]+')':'Busiest day · Not enough data yet',
      topHour?'Busiest time band · '+topHour[0]+' ('+topHour[1]+')':'Busiest time band · Not enough data yet'
    ]));
    r.append(table(['Day','Visits'],days.slice(1).concat('Sunday').map(d=>[d,dayCount[d]||0])));
    const bands=['Before 10 AM','10–11:59 AM','12–1:59 PM','2–3:59 PM','4 PM and later'];
    r.append(table(['Time Band','Visits'],bands.map(b=>[b,hourCount[b]||0])));
    r.append(card('USAGE NOTE',['This is a demo analytical view based on locally recorded visit and occupancy activity.']));
  }

  if(view==='Librarian Command Center'){
    const books=Array.isArray(libraryState.books)?libraryState.books:[];
    const loans=Array.isArray(libraryState.loans)?libraryState.loans:[];
    const holds=Array.isArray(libraryState.holds)?libraryState.holds:[];
    const acquisitions=Array.isArray(libraryState.acquisitions)?libraryState.acquisitions:[];
    const equipment=Array.isArray(libraryState.equipment)?libraryState.equipment:[];
    const maintenance=Array.isArray(libraryState.maintenanceRequests)?libraryState.maintenanceRequests:[];
    const queue=Array.isArray(libraryState.serviceQueue)?libraryState.serviceQueue:[];
    const inside=Array.isArray(libraryState.occupancyLog)?libraryState.occupancyLog.filter(x=>x.status==='Inside').length:0;
    const activeLoans=loans.filter(l=>!l.returned).length;
    const overdue=typeof libraryOverdues==='function'?libraryOverdues().length:0;
    const waiting=holds.filter(h=>!['completed','cancelled','expired / released'].includes(String(h.status||'').toLowerCase())).length;
    const queueWaiting=queue.filter(x=>x.status==='Waiting').length;
    const equipmentIssues=equipment.filter(x=>['maintenance','needs service'].includes(String(x.status||x.condition||'').toLowerCase())).length;
    const openMaint=maintenance.filter(x=>!['Completed','Closed','Resolved'].includes(x.status)).length;
    r.append(card('LIBRARIAN COMMAND CENTER',[
      'Single-screen operational overview for today',
      'Catalog · '+books.length+' titles',
      'Active loans · '+activeLoans+' · Overdue · '+overdue,
      'Reservations / holds · '+waiting,
      'Current occupancy · '+inside,
      'Service queue waiting · '+queueWaiting,
      'Equipment issues · '+equipmentIssues+' · Open maintenance · '+openMaint,
      'Acquisition records · '+acquisitions.length
    ]));
    const grid=el('div',undefined,'items');
    [
      ['BORROW / RETURN','Borrow / Return'],
      ['OVERDUE & FINES','Overdue & Fines'],
      ['RESERVATIONS','Reservations / Hold Queue'],
      ['OCCUPANCY','Library Occupancy Monitor'],
      ['SERVICE QUEUE','Library Service Counter Queue'],
      ['EQUIPMENT','Library Equipment Tracking'],
      ['MAINTENANCE','Library Maintenance Requests'],
      ['ACQUISITIONS','Acquisition Requests'],
      ['DEMAND ANALYTICS','Book Demand / Waitlist Analytics'],
      ['USAGE HEATMAP','Library Usage Heatmap']
    ].forEach(([label,target])=>grid.append(action(label,()=>libraryView(target),'item')));
    r.append(grid);
    const alerts=[];
    if(overdue)alerts.push(overdue+' overdue loan(s) need follow-up');
    if(waiting)alerts.push(waiting+' reservation / hold item(s) active');
    if(queueWaiting)alerts.push(queueWaiting+' client(s) waiting at service counter');
    if(equipmentIssues+openMaint)alerts.push((equipmentIssues+openMaint)+' equipment / maintenance issue(s) require attention');
    r.append(card('ATTENTION NOW',alerts.length?alerts:['No high-priority demo alerts right now.']));
  }
  syncFeatureHighlights();
};
'''
          c=c.replace(anchor,block+'\n'+anchor,1)
          p.write_text(c,encoding='utf-8')
          PY
      - name: Commit patched page
        run: |
          git config user.name "School Orbit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add Librarian demand curriculum heatmap and command center"
          git push
