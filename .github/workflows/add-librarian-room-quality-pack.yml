name: Add Librarian Room Quality Pack
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-librarian-room-quality-pack.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Librarian room and quality pack
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/index.html')
          c=p.read_text(encoding='utf-8')
          def rep(a,b,label):
              global c
              if a not in c: raise SystemExit('Missing '+label)
              c=c.replace(a,b,1)

          rep("""'Librarian:book-request-approval':'librarian-book-request-approval-2026-09-22-v1',
'Librarian:subscription-alerts':'librarian-subscription-alerts-2026-09-22-v1',
'Librarian:patron-blocking':'librarian-patron-blocking-2026-09-22-v1',
'Librarian:daily-ops':'librarian-daily-ops-2026-09-22-v1'""",
              """'Librarian:reading-room-reservation':'librarian-reading-room-reservation-2026-09-22-v1',
'Librarian:closing-checklist':'librarian-closing-checklist-2026-09-22-v1',
'Librarian:data-quality':'librarian-data-quality-2026-09-22-v1',
'Librarian:weeding-review':'librarian-weeding-review-2026-09-22-v1'""",'release batch')

          rep("""if(role==='Librarian'&&label==='Book Request Approval Queue')return 'Librarian:book-request-approval';
if(role==='Librarian'&&label==='Subscription Renewal Alerts')return 'Librarian:subscription-alerts';
if(role==='Librarian'&&label==='Patron Blocking / Restrictions')return 'Librarian:patron-blocking';
if(role==='Librarian'&&label==='Daily Operations Dashboard')return 'Librarian:daily-ops';
return null;""",
              """if(role==='Librarian'&&label==='Reading Room Reservation')return 'Librarian:reading-room-reservation';
if(role==='Librarian'&&label==='Library Closing Checklist')return 'Librarian:closing-checklist';
if(role==='Librarian'&&label==='Duplicate / Data Quality Checker')return 'Librarian:data-quality';
if(role==='Librarian'&&label==='Collection Weeding Review')return 'Librarian:weeding-review';
return null;""",'feature ids')

          rep("""if(activeRole==='Librarian'&&b.classList.contains('node')){
  if(label==='Acquisitions'&&featureUnseen('Librarian:book-request-approval'))unseen=true;
  if(label==='Catalog & Collection'&&featureUnseen('Librarian:subscription-alerts'))unseen=true;
  if(label==='Circulation'&&featureUnseen('Librarian:patron-blocking'))unseen=true;
  if(label==='Library Dashboard'&&featureUnseen('Librarian:daily-ops'))unseen=true;
}""",
              """if(activeRole==='Librarian'&&b.classList.contains('node')){
  if(label==='Programs & Engagement'&&featureUnseen('Librarian:reading-room-reservation'))unseen=true;
  if(label==='Library Dashboard'&&featureUnseen('Librarian:closing-checklist'))unseen=true;
  if(label==='Catalog & Collection'&&(featureUnseen('Librarian:data-quality')||featureUnseen('Librarian:weeding-review')))unseen=true;
}""",'highlights')

          rep("'Library Dashboard':['Today’s Library Overview','Daily Operations Dashboard','Circulation Summary','Overdue Alerts','Inventory Status','Quick Actions','Library Settings','Library Notifications','User Access & Permissions'],",
              "'Library Dashboard':['Today’s Library Overview','Daily Operations Dashboard','Circulation Summary','Overdue Alerts','Inventory Status','Quick Actions','Library Closing Checklist','Library Settings','Library Notifications','User Access & Permissions'],",'dashboard menu')
          rep("'Catalog & Collection':['Book Catalog','New Arrivals','Shelf Location Finder','Barcode / ISBN Lookup','Digital Resources','Book Donation Management','Bulk Import Books','Archive / Withdrawn Books','Accession Register','Periodicals / Magazine Management','Subscription Renewal Alerts'],",
              "'Catalog & Collection':['Book Catalog','New Arrivals','Shelf Location Finder','Barcode / ISBN Lookup','Digital Resources','Book Donation Management','Bulk Import Books','Archive / Withdrawn Books','Accession Register','Periodicals / Magazine Management','Subscription Renewal Alerts','Duplicate / Data Quality Checker','Collection Weeding Review'],",'catalog menu')
          rep("'Programs & Engagement':['Reading Program Tracker','Popular Books / Most Borrowed','Library Visit Log','Library Announcements','Reading Room / Seat Management','Library Calendar','Library Feedback & Suggestions','Lost & Found Management'],",
              "'Programs & Engagement':['Reading Program Tracker','Popular Books / Most Borrowed','Library Visit Log','Library Announcements','Reading Room / Seat Management','Reading Room Reservation','Library Calendar','Library Feedback & Suggestions','Lost & Found Management'],",'programs menu')

          anchor="const librarianModuleBase=openModule;"
          if anchor not in c: raise SystemExit('Missing module anchor')
          block=r'''
/* Librarian reading room, closing checklist, data quality, and weeding pack */
if(!Array.isArray(libraryState.roomReservations))libraryState.roomReservations=[
  {id:'ROOM-001',name:'Mika Reyes',space:'Study Table 2',date:'2026-09-22',time:'14:00',duration:60,purpose:'Group study',status:'Reserved'}
];
if(!Array.isArray(libraryState.closingChecklist))libraryState.closingChecklist=[];
if(!Array.isArray(libraryState.weedingReviews))libraryState.weedingReviews=[];
librarySave();

const libraryViewRoomQualityBase=libraryView;
libraryView=function(view){
  const special=['Reading Room Reservation','Library Closing Checklist','Duplicate / Data Quality Checker','Collection Weeding Review'];
  if(!special.includes(view))return libraryViewRoomQualityBase(view);
  featureOpened(view);currentModule=view;
  if(typeof libraryAudit==='function')libraryAudit('Opened '+view,view);
  const r=demoPanel(view,'Librarian workspace · Demo');$('module-back').hidden=true;

  if(view==='Reading Room Reservation'){
    const today=staffDate();
    r.append(card('READING ROOM RESERVATION',[
      libraryState.roomReservations.filter(x=>x.status==='Reserved'&&x.date>=today).length+' upcoming reservation(s)',
      'Reserve study tables or group-reading spaces and avoid duplicate time slots.'
    ]));
    r.append(form([
      {key:'name',label:'Student / user name'},
      {key:'space',label:'Reading space',options:['Study Table 1','Study Table 2','Study Table 3','Group Reading Area','Quiet Corner']},
      {key:'date',label:'Reservation date',type:'date'},
      {key:'time',label:'Start time',type:'time'},
      {key:'duration',label:'Duration (minutes)',type:'number'},
      {key:'purpose',label:'Purpose'}
    ],'RESERVE SPACE',v=>{
      const conflict=libraryState.roomReservations.some(x=>x.status==='Reserved'&&x.space===v.space&&x.date===v.date&&x.time===v.time);
      if(conflict){feedback('That space and time are already reserved.');return}
      libraryState.roomReservations.unshift({id:'ROOM-'+Date.now().toString().slice(-6),name:v.name,space:v.space,date:v.date,time:v.time,duration:Math.max(30,Number(v.duration)||60),purpose:v.purpose||'Reading / study',status:'Reserved'});
      librarySave('Reading room reservation saved.');libraryView(view);
    }));
    libraryState.roomReservations.forEach(x=>{
      const box=card(x.id+' · '+x.space,[x.name,x.date+' · '+x.time,'Duration · '+x.duration+' min','Purpose · '+x.purpose,'Status · '+x.status]);
      if(x.status==='Reserved')box.append(action('MARK COMPLETED',()=>{x.status='Completed';librarySave('Reservation completed.');libraryView(view)},'primary'),action('CANCEL',()=>{x.status='Cancelled';librarySave('Reservation cancelled.');libraryView(view)},'outline'));
      r.append(box);
    });
  }

  if(view==='Library Closing Checklist'){
    const today=staffDate();
    const defaults=['Circulation counter cleared','Returned books secured','Computers shut down','Scanner and printer powered off','Reading room checked','Windows and doors checked','Lights switched off','Incident notes reviewed','Keys secured'];
    let rec=libraryState.closingChecklist.find(x=>x.date===today);
    if(!rec){rec={date:today,items:defaults.map(label=>({label,done:false})),closed:false};libraryState.closingChecklist.unshift(rec);librarySave();}
    const done=rec.items.filter(x=>x.done).length;
    r.append(card('LIBRARY CLOSING CHECKLIST · '+today,[done+' of '+rec.items.length+' task(s) complete','Status · '+(rec.closed?'CLOSED':'OPEN')]));
    rec.items.forEach((x,i)=>{
      const b=action((x.done?'✓ ':'○ ')+x.label,()=>{if(rec.closed)return;x.done=!x.done;librarySave('Checklist updated.');libraryView(view)},x.done?'primary':'outline');
      r.append(b);
    });
    if(!rec.closed)r.append(action('CLOSE LIBRARY FOR THE DAY',()=>{
      if(rec.items.some(x=>!x.done)){feedback('Complete all closing checklist items first.');return}
      rec.closed=true;rec.closedAt=new Date().toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'});librarySave('Library closing checklist completed.');libraryView(view);
    },'primary'));
    if(rec.closed)r.append(card('CLOSING COMPLETE',['Closed at · '+rec.closedAt,'All required demo checklist items were completed.']));
  }

  if(view==='Duplicate / Data Quality Checker'){
    const books=libraryState.books||[];
    const issues=[];
    const idSeen=new Set(),titleSeen=new Map();
    books.forEach(b=>{
      if(!b.id)issues.push(['Missing Book ID',b.title||'Untitled','Add a unique book ID']);
      else if(idSeen.has(b.id))issues.push(['Duplicate Book ID',b.id,'Assign a unique ID']);
      else idSeen.add(b.id);
      const key=String(b.title||'').trim().toLowerCase();
      if(key){if(titleSeen.has(key))issues.push(['Possible Duplicate Title',b.title,'Compare with '+titleSeen.get(key)]);else titleSeen.set(key,b.id||'unknown');}
      if(!String(b.title||'').trim())issues.push(['Missing Title',b.id||'Unknown','Enter a title']);
      if(!String(b.callNo||'').trim())issues.push(['Missing Call Number',b.title||b.id||'Unknown','Assign call number']);
      if(!String(b.shelf||'').trim())issues.push(['Missing Shelf Location',b.title||b.id||'Unknown','Assign shelf location']);
      if(Number(b.available||0)>Number(b.copies||0))issues.push(['Invalid Availability',b.title||b.id||'Unknown','Available copies exceed total copies']);
    });
    r.append(card('DUPLICATE / DATA QUALITY CHECKER',[books.length+' catalog title(s) scanned',issues.length+' possible issue(s) found']));
    if(!issues.length)r.append(card('DATA QUALITY PASSED',['No obvious duplicate IDs, missing titles, call numbers, shelf locations, or invalid copy counts were detected.']));
    else r.append(table(['Issue','Record','Recommended Fix'],issues));
    r.append(action('RUN CHECK AGAIN',()=>libraryView(view),'outline'));
  }

  if(view==='Collection Weeding Review'){
    const loans=libraryState.loans||[];
    const review=libraryState.books.map(b=>{
      const uses=loans.filter(l=>l.bookId===b.id||l.title===b.title).length;
      const reasons=[];
      if(uses===0)reasons.push('No recorded circulation');
      if(String(b.status||'').toLowerCase().includes('damaged'))reasons.push('Damaged status');
      if(Number(b.copies||0)>=5&&uses<=1)reasons.push('High duplicate count / low use');
      return {book:b,uses,reasons};
    }).filter(x=>x.reasons.length);
    r.append(card('COLLECTION WEEDING REVIEW',[review.length+' title(s) flagged for librarian review','Flagging does not automatically remove a book from the catalog.']));
    review.forEach(x=>{
      const existing=libraryState.weedingReviews.find(w=>w.bookId===x.book.id&&w.status!=='Cancelled');
      const box=card(x.book.id+' · '+x.book.title,['Shelf · '+(x.book.shelf||'—'),'Recorded circulation · '+x.uses,'Reason(s) · '+x.reasons.join('; '),'Review status · '+(existing?existing.status:'Not reviewed')]);
      if(!existing)box.append(action('FLAG FOR WEEDING REVIEW',()=>{libraryState.weedingReviews.unshift({id:'WEED-'+Date.now().toString().slice(-6),bookId:x.book.id,title:x.book.title,reasons:x.reasons.join('; '),status:'For Review',date:staffDate()});librarySave('Title flagged for weeding review.');libraryView(view)},'outline'));
      else if(existing.status==='For Review')box.append(action('KEEP IN COLLECTION',()=>{existing.status='Keep';librarySave('Title retained in collection.');libraryView(view)},'primary'),action('RECOMMEND WITHDRAWAL',()=>{existing.status='Recommend Withdrawal';librarySave('Withdrawal recommendation saved.');libraryView(view)},'outline'));
      r.append(box);
    });
    if(libraryState.weedingReviews.length)r.append(table(['Date','Book ID','Title','Reason','Decision'],libraryState.weedingReviews.map(x=>[x.date,x.bookId,x.title,x.reasons,x.status])));
  }
  syncFeatureHighlights();
};
'''
          c=c.replace(anchor,block+'\n'+anchor,1)
          p.write_text(c,encoding='utf-8')
          PY
      - name: Commit patched page
        run: |
          git config user.name "School Orbit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add Librarian room reservations closing checklist data quality and weeding"
          git push
