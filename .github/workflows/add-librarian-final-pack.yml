name: Add Librarian Final Pack
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-librarian-final-pack.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Librarian final pack
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/index.html')
          c=p.read_text(encoding='utf-8')
          def rep(a,b,label):
              global c
              if a not in c: raise SystemExit('Missing '+label)
              c=c.replace(a,b,1)
          rep("""'Librarian:special-borrowing':'librarian-special-borrowing-2026-09-22-v1',
'Librarian:lost-found':'librarian-lost-found-2026-09-22-v1',
'Librarian:maintenance-requests':'librarian-maintenance-requests-2026-09-22-v1',
'Librarian:kpi-dashboard':'librarian-kpi-dashboard-2026-09-22-v1'""",
              """'Librarian:book-request-approval':'librarian-book-request-approval-2026-09-22-v1',
'Librarian:subscription-alerts':'librarian-subscription-alerts-2026-09-22-v1',
'Librarian:patron-blocking':'librarian-patron-blocking-2026-09-22-v1',
'Librarian:daily-ops':'librarian-daily-ops-2026-09-22-v1'""",'release batch')
          rep("""if(role==='Librarian'&&label==='Special Borrowing Exceptions')return 'Librarian:special-borrowing';
if(role==='Librarian'&&label==='Lost & Found Management')return 'Librarian:lost-found';
if(role==='Librarian'&&label==='Library Maintenance Requests')return 'Librarian:maintenance-requests';
if(role==='Librarian'&&label==='Library KPI Dashboard')return 'Librarian:kpi-dashboard';
return null;""",
              """if(role==='Librarian'&&label==='Book Request Approval Queue')return 'Librarian:book-request-approval';
if(role==='Librarian'&&label==='Subscription Renewal Alerts')return 'Librarian:subscription-alerts';
if(role==='Librarian'&&label==='Patron Blocking / Restrictions')return 'Librarian:patron-blocking';
if(role==='Librarian'&&label==='Daily Operations Dashboard')return 'Librarian:daily-ops';
return null;""",'feature ids')
          rep("""if(activeRole==='Librarian'&&b.classList.contains('node')){
  if(label==='Circulation'&&featureUnseen('Librarian:special-borrowing'))unseen=true;
  if(label==='Programs & Engagement'&&featureUnseen('Librarian:lost-found'))unseen=true;
  if(label==='Inventory'&&featureUnseen('Librarian:maintenance-requests'))unseen=true;
  if(label==='Reports'&&featureUnseen('Librarian:kpi-dashboard'))unseen=true;
}""",
              """if(activeRole==='Librarian'&&b.classList.contains('node')){
  if(label==='Acquisitions'&&featureUnseen('Librarian:book-request-approval'))unseen=true;
  if(label==='Catalog & Collection'&&featureUnseen('Librarian:subscription-alerts'))unseen=true;
  if(label==='Circulation'&&featureUnseen('Librarian:patron-blocking'))unseen=true;
  if(label==='Library Dashboard'&&featureUnseen('Librarian:daily-ops'))unseen=true;
}""",'highlights')
          rep("'Library Dashboard':['Today’s Library Overview','Circulation Summary','Overdue Alerts','Inventory Status','Quick Actions','Library Settings','Library Notifications','User Access & Permissions'],",
              "'Library Dashboard':['Today’s Library Overview','Daily Operations Dashboard','Circulation Summary','Overdue Alerts','Inventory Status','Quick Actions','Library Settings','Library Notifications','User Access & Permissions'],",'dashboard menu')
          rep("'Catalog & Collection':['Book Catalog','New Arrivals','Shelf Location Finder','Barcode / ISBN Lookup','Digital Resources','Book Donation Management','Bulk Import Books','Archive / Withdrawn Books','Accession Register','Periodicals / Magazine Management'],",
              "'Catalog & Collection':['Book Catalog','New Arrivals','Shelf Location Finder','Barcode / ISBN Lookup','Digital Resources','Book Donation Management','Bulk Import Books','Archive / Withdrawn Books','Accession Register','Periodicals / Magazine Management','Subscription Renewal Alerts'],",'catalog menu')
          rep("'Circulation':['Borrow / Return','Reservations / Hold Queue','Reservation Expiry Management','Borrower History','Library Card / QR Verification','Borrowing Rules','Special Borrowing Exceptions','Lost Library Card / Replacement','Inter-Library Loan','Library Service Counter Queue'],",
              "'Circulation':['Borrow / Return','Reservations / Hold Queue','Reservation Expiry Management','Borrower History','Library Card / QR Verification','Borrowing Rules','Special Borrowing Exceptions','Patron Blocking / Restrictions','Lost Library Card / Replacement','Inter-Library Loan','Library Service Counter Queue'],",'circulation menu')
          rep("'Acquisitions':['Acquisition Requests','Approved Requests','Ordered Books','Received Books','Teacher Resource Requests','Budget & Acquisition Tracking','Publisher / Supplier Directory'],",
              "'Acquisitions':['Acquisition Requests','Book Request Approval Queue','Approved Requests','Ordered Books','Received Books','Teacher Resource Requests','Budget & Acquisition Tracking','Publisher / Supplier Directory'],",'acquisitions menu')
          anchor="const librarianModuleBase=openModule;"
          if anchor not in c: raise SystemExit('Missing module anchor')
          block=r'''
/* Librarian approvals, renewals, patron restrictions, and daily operations pack */
if(!Array.isArray(libraryState.bookRequests))libraryState.bookRequests=[{id:'BRQ-001',requester:'Mika Reyes',role:'Student',title:'Intro to Python for Teens',author:'Any',reason:'Coding club reference',status:'Pending',date:'2026-09-22'}];
if(!Array.isArray(libraryState.patronRestrictions))libraryState.patronRestrictions=[{id:'BLK-001',name:'Jamie Dela Cruz',borrowerId:'STU-2026-014',reason:'Unresolved overdue item',until:'2026-10-05',status:'Active',date:'2026-09-22'}];
librarySave();
const libraryViewLastPackBase=libraryView;
libraryView=function(view){
  const special=['Book Request Approval Queue','Subscription Renewal Alerts','Patron Blocking / Restrictions','Daily Operations Dashboard'];
  if(!special.includes(view))return libraryViewLastPackBase(view);
  featureOpened(view);currentModule=view;
  if(typeof libraryAudit==='function')libraryAudit('Opened '+view,view);
  const r=demoPanel(view,'Librarian workspace · Demo');$('module-back').hidden=true;
  if(view==='Book Request Approval Queue'){
    r.append(card('BOOK REQUEST APPROVAL QUEUE',[libraryState.bookRequests.filter(x=>x.status==='Pending').length+' pending request(s)','Review student and teacher title requests before acquisition.']));
    r.append(form([{key:'requester',label:'Requester name'},{key:'role',label:'Role',options:['Student','Teacher','Staff','Parent']},{key:'title',label:'Requested title'},{key:'author',label:'Author / publisher'},{key:'reason',label:'Reason',type:'textarea'}],'SUBMIT BOOK REQUEST',v=>{libraryState.bookRequests.unshift({id:'BRQ-'+Date.now().toString().slice(-6),...v,status:'Pending',date:staffDate()});librarySave('Book request submitted.');libraryView(view)}));
    libraryState.bookRequests.forEach(x=>{const box=card(x.id+' · '+x.title,[x.requester+' · '+x.role,'Author / publisher · '+x.author,'Reason · '+x.reason,'Status · '+x.status,'Date · '+x.date]);if(x.status==='Pending')box.append(action('APPROVE',()=>{x.status='Approved';if(Array.isArray(libraryState.acquisitions))libraryState.acquisitions.unshift({id:'ACQ-'+Date.now().toString().slice(-6),title:x.title,author:x.author,category:'Requested',requestedBy:x.requester,reason:x.reason,status:'Approved'});librarySave('Request approved and sent to acquisitions.');libraryView(view)},'primary'),action('DECLINE',()=>{x.status='Declined';librarySave('Book request declined.');libraryView(view)},'outline'));r.append(box)});
  }
  if(view==='Subscription Renewal Alerts'){
    const today=staffDate();const rows=[];
    (libraryState.periodicals||[]).forEach(x=>{const days=x.renewal?Math.ceil((new Date(x.renewal+'T12:00:00+08:00')-new Date(today+'T12:00:00+08:00'))/86400000):null;rows.push({name:x.title,type:'Periodical',renewal:x.renewal,days,status:x.status})});
    (libraryState.digitalResources||[]).forEach(x=>{if(x.expiry||x.renewal){const d=x.expiry||x.renewal;const days=Math.ceil((new Date(d+'T12:00:00+08:00')-new Date(today+'T12:00:00+08:00'))/86400000);rows.push({name:x.title||x.name,type:'Digital Resource',renewal:d,days,status:x.status||'Active'})}});
    rows.sort((a,b)=>(a.renewal||'9999').localeCompare(b.renewal||'9999'));
    r.append(card('SUBSCRIPTION RENEWAL ALERTS',[rows.filter(x=>x.days!==null&&x.days<=30).length+' renewal(s) due within 30 days','Track periodicals and digital resources nearing expiry.']));
    r.append(table(['Resource','Type','Renewal / Expiry','Days Left','Status'],rows.map(x=>[x.name,x.type,x.renewal||'—',x.days===null?'—':x.days,x.days<0?'Expired':x.days<=30?'Renew Soon':x.status])));
  }
  if(view==='Patron Blocking / Restrictions'){
    r.append(card('PATRON BLOCKING / RESTRICTIONS',[libraryState.patronRestrictions.filter(x=>x.status==='Active').length+' active restriction(s)','Temporarily prevent borrowing for unresolved lost books, fines, or repeated violations.']));
    r.append(form([{key:'name',label:'Patron name'},{key:'borrowerId',label:'Borrower ID'},{key:'reason',label:'Reason',type:'textarea'},{key:'until',label:'Restriction until',type:'date'}],'ADD RESTRICTION',v=>{libraryState.patronRestrictions.unshift({id:'BLK-'+Date.now().toString().slice(-6),...v,status:'Active',date:staffDate()});librarySave('Patron restriction added.');libraryView(view)}));
    libraryState.patronRestrictions.forEach(x=>{const expired=x.until&&x.until<staffDate();const box=card(x.name+' · '+x.borrowerId,['Reason · '+x.reason,'Until · '+x.until,'Status · '+(expired&&x.status==='Active'?'Expired':x.status)]);if(x.status==='Active'&&!expired)box.append(action('LIFT RESTRICTION',()=>{x.status='Lifted';x.lifted=staffDate();librarySave('Restriction lifted.');libraryView(view)},'primary'));r.append(box)});
  }
  if(view==='Daily Operations Dashboard'){
    const today=staffDate(),loans=libraryState.loans||[],holds=libraryState.holds||[],queue=libraryState.serviceQueue||[],inc=libraryState.incidents||[],mnt=libraryState.maintenanceRequests||[];
    const borrowedToday=loans.filter(x=>x.borrowed===today).length,returnedToday=loans.filter(x=>x.returned===today).length,overdue=libraryOverdues().length,ready=holds.filter(x=>x.status==='Ready').length,waiting=queue.filter(x=>x.status==='Waiting').length,openInc=inc.filter(x=>x.status!=='Closed').length,openMnt=mnt.filter(x=>!['Completed','Cancelled'].includes(x.status)).length;
    r.append(card('DAILY OPERATIONS DASHBOARD · '+today,['Borrowed today · '+borrowedToday,'Returned today · '+returnedToday,'Overdue alerts · '+overdue,'Ready reservations · '+ready,'Service queue waiting · '+waiting,'Open incidents · '+openInc,'Open maintenance requests · '+openMnt]));
    r.append(table(['Today’s Operation','Count'],[['Borrowed Today',borrowedToday],['Returned Today',returnedToday],['Overdue Loans',overdue],['Ready Reservations',ready],['Queue Waiting',waiting],['Open Incidents',openInc],['Open Maintenance',openMnt]]));
    r.append(action('BORROW / RETURN',()=>libraryView('Borrow / Return'),'outline'),action('SERVICE QUEUE',()=>libraryView('Library Service Counter Queue'),'outline'),action('RESERVATIONS',()=>libraryView('Reservations / Hold Queue'),'outline'));
  }
  syncFeatureHighlights();
};
'''
          c=c.replace(anchor,block+'\n'+anchor,1)
          p.write_text(c,encoding='utf-8')
          PY
      - name: Commit patched page
        run: |
          git config user.name "School Orbit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Add Librarian approvals renewals restrictions and daily ops"
          git push
# trigger
