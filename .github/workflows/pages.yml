name: Deploy School Orbit to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Librarian title render
        run: |
          python scripts/fix_librarian_title.py
          git config user.name "School Orbit QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet || (git commit -m "Fix Librarian Orbit title render" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
