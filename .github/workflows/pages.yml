name: Deploy School Orbit to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final Librarian visuals once
        shell: bash
        run: |
          if grep -q "LIBRARIAN FINAL VISUALS 2026-09-22" docs/index.html; then
            echo "Final Librarian visuals already applied"
          else
            python scripts/run_librarian_final_visuals.py
            python - <<'PY'
          from pathlib import Path
          import re
          c=Path('docs/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',c,re.S)
          Path('/tmp/school-orbit.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
            node --check /tmp/school-orbit.js
            git config user.name "School Orbit QA Bot"
            git config user.email "actions@users.noreply.github.com"
            git add docs/index.html
            git commit -m "Finalize Librarian title and orbit spacing"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
