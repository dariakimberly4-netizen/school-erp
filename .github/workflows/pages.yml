name: Deploy School Orbit to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Librarian final pack once
        shell: bash
        run: |
          if grep -q "Book Request Approval Queue" docs/index.html; then
            echo "Librarian final pack already applied"
          else
            python - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/add-librarian-final-pack.yml').read_text(encoding='utf-8')
          start=wf.index("python - <<'PY'")+len("python - <<'PY'\n")
          end=wf.index("\n          PY",start)
          raw=wf[start:end].splitlines()
          code='\n'.join((line[10:] if line.startswith('          ') else line) for line in raw)
          exec(compile(code,'embedded_librarian_patch.py','exec'))
          PY
            git config user.name "School Orbit Bot"
            git config user.email "actions@users.noreply.github.com"
            git add docs/index.html
            git commit -m "Add Librarian request approvals renewals restrictions and daily ops"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4