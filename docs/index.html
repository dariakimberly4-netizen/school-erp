<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Orbit</title><style>*{box-sizing:border-box}body{margin:0;background:#020617;color:#fff;font-family:system-ui,-apple-system,sans-serif;min-height:100vh}.head{padding:20px 16px;text-align:center}.head small{color:#67e8f9;letter-spacing:.25em;font-weight:800}.head h1{margin:6px 0}.top{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.top button,.back{background:#172033;color:#fff;border:1px solid #334155;border-radius:14px;padding:12px 15px;font-weight:750}.orbit{position:relative;width:min(94vw,680px);aspect-ratio:1;margin:12px auto;border:1px solid #164e63;border-radius:50%;background:radial-gradient(circle,#08334455 0 23%,transparent 24%)}.ring{position:absolute;inset:24%;border:1px solid #155e75;border-radius:50%}.center,.node{position:absolute;border:1px solid #22d3ee66;background:#0f172a;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;box-shadow:0 8px 24px #0008}.center{left:50%;top:50%;transform:translate(-50%,-50%);width:29%;aspect-ratio:1;flex-direction:column;font-weight:900;font-size:clamp(18px,5vw,34px)}.center small{font-size:9px;color:#67e8f9;letter-spacing:.18em}.node{width:18%;aspect-ratio:1;transform:translate(-50%,-50%);font-size:clamp(8px,2.1vw,13px);font-weight:750;padding:4px}.panel{position:fixed;inset:0;background:#020617f7;display:none;padding:18px;overflow:auto;z-index:10}.panel.open{display:block}.card{max-width:680px;margin:18px auto;background:#0f172a;border:1px solid #164e63;border-radius:24px;padding:22px}.items{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.item{background:#111c31;border:1px solid #1e3a5f;border-radius:16px;padding:17px;font-weight:650}.foot{text-align:center;color:#64748b;padding:16px;font-size:12px}@media(max-width:480px){.orbit{width:96vw}.node{width:19%}.items{grid-template-columns:1fr}.head h1{font-size:24px}}</style></head><body><div class="head"><small>SCHOOL ERP</small><h1>School Command Center</h1><div class="top"><button onclick="showSpecial('Global Search',['Search Student','Search Teacher','Search Class','Search Record'])">🔎 Search</button><button onclick="showSpecial('Notifications',['Attendance Alert','Fee Reminder','School Announcement','Pending Approval'])">🔔 Notifications</button><button onclick="showSpecial('Login & Roles',['Administrator','Teacher','Staff','Student','Parent'])">👤 Roles</button></div></div><div class="orbit" id="orbit"><div class="ring"></div><button class="center" onclick="showSpecial('Command Center',['Today','Notifications','Quick Add','Search Student','School Calendar','Pending Tasks'])"><small>SCHOOL</small>ORBIT<small>COMMAND CENTER</small></button></div><div class="foot">Tap a module • Large mobile-friendly controls • One-hand navigation</div><div id="panel" class="panel"><div class="card"><button class="back" onclick="closePanel()">← Back to Orbit</button><h1 id="title"></h1><p id="desc"></p><div class="items" id="items"></div></div></div><script>const mods=[['Students',['Student List','New Admission','Student Profile','Enrollment','Promotion / Transfer','Documents','Student ID']],['Teachers & Staff',['Teacher List','Staff List','Profiles','Assign Subjects','Workload','Leave','Performance']],['Classes',['Grade Levels','Sections','Subjects','Class Adviser','Student Assignment','Rooms']],['Attendance',['Daily Attendance','Student Attendance','Teacher / Staff Attendance','Absences','Late Records','Attendance Reports']],['Timetable',['Class Schedule','Teacher Schedule','Room Schedule','School Calendar']],['Exams',['Exam Setup','Exam Schedule','Subjects','Grade Entry','Exam Records']],['Grades & Results',['Gradebook','Report Cards','Rankings / Honors','Promotion Status','Academic History']],['Fees & Billing',['Fee Setup','Student Accounts','Payments','Balances','Discounts','Receipts','Collection Reports']],['Library',['Book Catalog','Borrow / Return','Borrowers','Overdue Books','Fines','Inventory']],['Parents',['Parent Accounts','Linked Students','Announcements','Messages','Student Progress']],['Reports',['Enrollment','Attendance','Academic','Fees','Teacher','Student','Printable / Export Reports']],['Administration',['Users & Roles','School Profile','Academic Year','Grade / Section Setup','Permissions','Backup','System Settings']]];const orbit=document.getElementById('orbit');mods.forEach((m,i)=>{let a=i/mods.length*Math.PI*2-Math.PI/2,r=43,b=document.createElement('button');b.className='node';b.style.left=(50+Math.cos(a)*r)+'%';b.style.top=(50+Math.sin(a)*r)+'%';b.textContent=m[0];b.onclick=()=>show(m[0]);orbit.appendChild(b)});function fill(name,items,desc){document.getElementById('title').textContent=name;document.getElementById('desc').textContent=desc;document.getElementById('items').innerHTML=items.map(x=>'<div class="item">'+x+'</div>').join('');document.getElementById('panel').classList.add('open')}function show(name){let m=mods.find(x=>x[0]===name);fill(name,m[1],'Choose a '+name+' function.')}function showSpecial(name,items){fill(name,items,'School Orbit '+name+'.')}function closePanel(){document.getElementById('panel').classList.remove('open')}</script></body></html>
