<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Orbit</title><style>*{box-sizing:border-box}body{margin:0;background:#020617;color:#fff;font-family:system-ui,-apple-system,sans-serif;min-height:100vh}.head{padding:24px;text-align:center}.head small{color:#67e8f9;letter-spacing:.25em;font-weight:800}.head h1{margin:6px 0}.orbit{position:relative;width:min(92vw,680px);aspect-ratio:1;margin:auto;border:1px solid #164e63;border-radius:50%;background:radial-gradient(circle,#08334455 0 23%,transparent 24%)}.ring{position:absolute;inset:24%;border:1px solid #155e75;border-radius:50%}.center,.node{position:absolute;border:1px solid #22d3ee66;background:#0f172a;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;box-shadow:0 8px 24px #0008}.center{left:50%;top:50%;transform:translate(-50%,-50%);width:28%;aspect-ratio:1;flex-direction:column;font-weight:900;font-size:clamp(18px,5vw,34px)}.center small{font-size:10px;color:#67e8f9;letter-spacing:.2em}.node{width:17%;aspect-ratio:1;transform:translate(-50%,-50%);font-size:clamp(9px,2.2vw,14px);font-weight:700;padding:4px}.node:hover,.node:focus{border-color:#67e8f9;outline:3px solid #22d3ee33}.panel{position:fixed;inset:0;background:#020617ee;display:none;padding:24px;overflow:auto;z-index:10}.panel.open{display:block}.card{max-width:650px;margin:30px auto;background:#0f172a;border:1px solid #164e63;border-radius:24px;padding:24px}.back{border:0;border-radius:14px;padding:14px 20px;font-weight:800}.items{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}.item{background:#111c31;border:1px solid #1e3a5f;border-radius:16px;padding:18px}.foot{text-align:center;color:#64748b;padding:20px;font-size:12px}@media(max-width:480px){.orbit{width:96vw}.node{width:19%}.items{grid-template-columns:1fr}}</style></head><body><div class="head"><small>SCHOOL ERP</small><h1>School Command Center</h1></div><div class="orbit" id="orbit"><div class="ring"></div><button class="center" onclick="show('School Orbit')"><small>SCHOOL</small>ORBIT</button></div><div class="foot">Tap any module • Mobile friendly • One-hand navigation</div><div id="panel" class="panel"><div class="card"><button class="back" onclick="closePanel()">← Back to Orbit</button><h1 id="title"></h1><p id="desc"></p><div class="items" id="items"></div></div></div><script>const mods=[['Students',['Student List','Enrollment','Profiles','Assignments']],['Teachers',['Teacher List','Schedules','Classes','Performance']],['Classes',['Class List','Sections','Subjects','Room Assignment']],['Attendance',['Daily Attendance','Student Attendance','Teacher Attendance','Reports']],['Timetable',['Class Schedule','Teacher Schedule','Rooms','Calendar']],['Exams',['Exam Schedule','Question Setup','Grades','Exam Reports']],['Results',['Student Results','Report Cards','Ranking','Analytics']],['Fees',['Fee Setup','Payments','Balances','Receipts']],['Library',['Books','Borrowing','Returns','Library Reports']],['Parents',['Parent Directory','Student Links','Messages','Updates']],['Reports',['Academic Reports','Attendance Reports','Fee Reports','Export']],['Settings',['School Profile','Users & Roles','Academic Year','System Settings']]];const orbit=document.getElementById('orbit');mods.forEach((m,i)=>{let a=i/mods.length*Math.PI*2-Math.PI/2,r=43,b=document.createElement('button');b.className='node';b.style.left=(50+Math.cos(a)*r)+'%';b.style.top=(50+Math.sin(a)*r)+'%';b.textContent=m[0];b.onclick=()=>show(m[0]);orbit.appendChild(b)});function show(name){let m=mods.find(x=>x[0]===name);document.getElementById('title').textContent=name;document.getElementById('desc').textContent=m?'School Orbit '+name+' module demo.':'Choose a module from the orbit.';document.getElementById('items').innerHTML=m?m[1].map(x=>'<div class="item">'+x+'</div>').join(''):'';document.getElementById('panel').classList.add('open')}function closePanel(){document.getElementById('panel').classList.remove('open')}</script></body></html>
